
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Lagos Talent Network</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <section class="auth-box">
        <h1>Reset Your Password</h1>
        <p>Enter your new password below.</p>

        <form id="resetForm">
            <input
                id="newPassword"
                type="password"
                placeholder="New password (at least 6 characters)"
                minlength="6"
                required
            >
            <button type="submit">Save New Password</button>
        </form>

        <p id="message" role="status"></p>
    </section>

    <script>
        const supabaseClient = window.supabase.createClient(
            "https://suqmleonqxhijkddfkso.supabase.co",
            "sb_publishable_pmoP0KdYsoF93ir6D9dm9Q_gTWWRxAD"
        );

        const resetForm = document.getElementById("resetForm");
        const message = document.getElementById("message");

        resetForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const newPassword =
                document.getElementById("newPassword").value;

            const { error } = await supabaseClient.auth.updateUser({
                password: newPassword
            });

            if (error) {
                message.textContent = "Password reset failed: " + error.message;
                return;
            }

            message.textContent = "Password updated! You can now log in.";
            resetForm.reset();
        });
    </script>
</body>
</html>
