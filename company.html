<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lagos Talent Network - Company Registration</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- FIX: this page was missing the Supabase connection -->
    <script>
        const supabaseClient = window.supabase.createClient(
            "https://suqmleonqxhijkddfkso.supabase.co",
            "sb_publishable_pmoP0KdYsoF93ir6D9dm9Q_gTWWRxAD"
        );
    </script>
</head>

<body>

    <a href="index.html" class="back-home">← Back to Home</a>

    <section class="registration">
        <h1>Join as a Company</h1>

        <p>Connect with talented people and find the skills your business needs.</p>

        <form onsubmit="createCompany(event)">
            <input type="text" placeholder="Company Name" required>
            <input type="email" placeholder="Email Address" required>
            <input type="text" placeholder="Industry" required>

            <button type="submit">Create Company Profile</button>
        </form>
        <h2 id="companyCount">Registered Companies: 0</h2>
        <div id="companyList"></div>
    </section>

    <script>
        async function createCompany(event) {
            event.preventDefault();

            const form = event.target;

            const company = {
                name: form.elements[0].value.trim(),
                email: form.elements[1].value.trim(),
                industry: form.elements[2].value.trim()
            };

            // FIX: try/catch so a crash shows an alert instead of failing silently
            try {
                const { error } = await supabaseClient
                    .from("companies")
                    .insert([company]);

                if (error) {
                    alert("Registration failed: " + error.message);
                    console.error(error);
                    return;
                }

                alert("Company profile created successfully!");
                form.reset();

            } catch (err) {
                console.error(err);
                alert("Something went wrong. Please try again.");
            }
        }
        async function displayCompanies() {
    const companyList = document.getElementById("companyList");
    const companyCount = document.getElementById("companyCount");

    companyList.replaceChildren();
    companyCount.textContent = "Loading companies...";

    const { data, error } = await supabaseClient
        .from("companies")
        .select("name, email, industry")
        .order("created_at", { ascending: false });

    if (error) {
        console.error(error);
        companyCount.textContent = "Could not load companies.";
        return;
    }

    companyCount.textContent = "Registered Companies: " + data.length;

    if (data.length === 0) {
        companyList.textContent = "No companies registered yet.";
        return;
    }

    data.forEach(company => {
        const card = document.createElement("div");
        card.className = "talent-card";

        const name = document.createElement("h3");
        name.textContent = company.name;

        const email = document.createElement("p");
        email.textContent = "Email: " + company.email;

        const industry = document.createElement("p");
        industry.textContent = "Industry: " + company.industry;

        card.append(name, email, industry);
        companyList.appendChild(card);
    });
}

displayCompanies();
    </script>

</body>
</html>
