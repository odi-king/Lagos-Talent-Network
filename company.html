<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lagos Talent Network - Company Registration</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <a href="index.html" class="back-home">← Back to Home</a>

    <section class="registration">
        <h1>Join as a Company</h1>

        <p>Connect with talented people and find the skills your business needs.</p>

        <form onsubmit="createCompany(event)">
            <input type="text" placeholder="Company Name" required>
            <input type="email" placeholder="Email Address" required>
            <input type="text" placeholder="Industry" required>

            <button type="submit">Create Company Profile</button>
        </form>
    </section>

    <script>
        async function createCompany(event) {
    event.preventDefault();

    const form = event.target;

    const company = {
        name: form.elements[0].value.trim(),
        email: form.elements[1].value.trim(),
        industry: form.elements[2].value.trim()
    };

    const { error } = await supabaseClient
        .from("companies")
        .insert([company]);

    if (error) {
        alert("Registration failed: " + error.message);
        console.error(error);
        return;
    }

    alert("Company profile created successfully!");
    form.reset();
}

    

    

    </script>

</body>
</html>
