
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lagos Talent Network - Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .auth-box {
            max-width: 420px;
            margin: 50px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 12px #0002;
        }
        .auth-box input {
            display: block;
            box-sizing: border-box;
            width: 100%;
            margin: 12px 0;
            padding: 12px;
        }
        .auth-box button {
            width: 100%;
            margin: 8px 0;
            padding: 12px;
            cursor: pointer;
        }
        #message {
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-home">← Back to Home</a>

    <section class="auth-box">
        <h1>Talent Account</h1>
        <p>Create an account or log in to Lagos Talent Network.</p>

        <form id="authForm">
            <input id="email" type="email" placeholder="Email address" required>
            <input id="password" type="password"
                   placeholder="Password (at least 6 characters)"
                   minlength="6" required>

            <button type="button" id="signupButton">Create Account</button>
            <button type="submit">Log In</button>
            <button type="button" id="resetPasswordButton">Forgot Password?</button>
        </form>

        <p id="message" role="status"></p>
    </section>

    <script>
        const supabaseClient = window.supabase.createClient(
            "https://suqmleonqxhijkddfkso.supabase.co",
            "sb_publishable_pmoP0KdYsoF93ir6D9dm9Q_gTWWRxAD"
        );

        const form = document.getElementById("authForm");
        const message = document.getElementById("message");

        document.getElementById("signupButton").addEventListener("click", async function () {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (!email || password.length < 6) {
                message.textContent = "Enter your email and a password of at least 6 characters.";
                return;
            }

            message.textContent = "Creating your account...";

            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password
            });

            if (error) {
                message.textContent = "Signup failed: " + error.message;
                return;
            }

            if (data.session) {
                message.textContent = "Account created! You are logged in.";
            } else {
                message.textContent = "Account created. Check your email for a confirmation link before logging in.";
            }
        });

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            message.textContent = "Logging in...";

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                message.textContent = "Login failed: " + error.message;
                return;
            }

            message.textContent = "Login successful! Redirecting...";
            window.location.href = "account.html";
        });

document.getElementById("resetPasswordButton").addEventListener("click", async function () {
    const email = document.getElementById("email").value.trim();
    const message = document.getElementById("message");

    if (!email) {
        message.textContent = "Enter your email address first.";
        return;
    }

    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: "https://odi-king.github.io/Lagos-Talent-Network/reset-password.html"
    });

    if (error) {
        message.textContent = "Reset failed: " + error.message;
    } else {
        message.textContent = "Password reset email sent. Check your inbox.";
    }
});

    </script>
</body>
</html>
