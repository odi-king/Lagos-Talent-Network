<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lagos Talent Network - Talent Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <a href="index.html" class="back-home">← Back to Home</a>

    <section class="registration">
        <h1>Join Lagos Talent Network</h1>

        <p>Showcase your talent and connect with companies.</p>

        <form onsubmit="createTalent(event)">
            <input type="text" placeholder="Full Name" required>
            <input type="email" placeholder="Email Address" required>
            <input type="text" placeholder="Your Skill" required>

            <button type="submit">Create Talent Profile</button>
        </form>
    </section>
    


<section class="talent-directory">
    <h2>Registered Talents</h2>
    <p id="talentCount">Registered Talents: 0</p>

    <input
        type="text"
        id="talentSearch"
        placeholder="Search by name or skill..."
    >

    <div id="talentList"></div>
</section>


<script>

function createTalent(event) {
    event.preventDefault();

    const form = event.target;
    const inputs = form.querySelectorAll("input");

    const talent = {
        name: inputs[0].value.trim(),
        email: inputs[1].value.trim(),
        skill: inputs[2].value.trim()
    };

    const talents = JSON.parse(
        localStorage.getItem("talents") || "[]"
    );

    talents.push(talent);

    localStorage.setItem("talents", JSON.stringify(talents));

    alert("Talent profile saved successfully! 🎉");

    form.reset();
}
function displayTalents() {
    const talents = JSON.parse(
        localStorage.getItem("talents") || "[]"
    );

    const talentList = document.getElementById("talentList");
    


    talentList.innerHTML = "";
    document.getElementById("talentCount").textContent =
    "Registered Talents: " + talents.length;

    const searchInput = document.getElementById("talentSearch");
const searchTerm = searchInput.value.toLowerCase().trim();

const filteredTalents = talents.filter(function(talent) {
    return talent.name.toLowerCase().includes(searchTerm) ||
           talent.skill.toLowerCase().includes(searchTerm);
});

filteredTalents.forEach(function(talent) { 
        const card = document.createElement("div");
        card.className = "talent-card";

        card.innerHTML = `
            <h3>${talent.name}</h3>
            <p>${talent.email}</p>
            <p>Skill: ${talent.skill}</p>
        `;
 
        talentList.appendChild(card);
    });
        if (filteredTalents.length === 0) {
        talentList.innerHTML = "<p>No talents found.</p>";
    }
}

displayTalents();

document.getElementById("talentSearch").addEventListener("input", displayTalents);
</script>
</body>
</html>
