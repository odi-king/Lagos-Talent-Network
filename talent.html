<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lagos Talent Network - Talent Registration</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // FIX 1: createClient (capital C), not createclient
        const supabaseClient = window.supabase.createClient(
            "https://suqmleonqxhijkddfkso.supabase.co",
            "sb_publishable_pmoP0KdYsoF93ir6D9dm9Q_gTWWRxAD"
        );
    </script>
</head>

<body> 
<div class="settings-menu">
    <button type="button" onclick="document.getElementById('settingsOptions').hidden = !document.getElementById('settingsOptions').hidden">
        ⚙️ Settings
    </button>

    <div id="settingsOptions" hidden>
        <button type="button" onclick="logoutUser()">Log Out</button>
    </div>
</div>
    <a href="index.html" class="back-home">← Back to Home</a>

    <section class="registration">
        <h1>Join Lagos Talent Network</h1>
        <p>Showcase your talent and connect with companies.</p>

        
            <input type="text" placeholder="Full Name" required>
            <input type="email" placeholder="Email Address" required>
            <input type="text" placeholder="Your Skill" required>
            <button type="submit">Create Talent Profile</button>
        </form>
    </section>

    <section class="talent-directory">
        <h2>Registered Talents</h2>
        <p id="talentCount">Registered Talents: 0</p>

        <input type="text" id="talentSearch" placeholder="Search by name or skill...">

        <div id="talentList"></div>
    </section>

<script>
    let allTalents = [];

    // FIX 5: escape user input before putting it in innerHTML
    function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text ?? "";
        return div.innerHTML;
    }

    async function createTalent(event) {
        event.preventDefault();

        const form = event.target;
        const inputs = form.querySelectorAll("input");

        const fullName = inputs[0].value.trim();
        const email = inputs[1].value.trim();
        const skill = inputs[2].value.trim();

        if (!fullName || !email || !skill) {
            alert("Please fill in all fields.");
            return;
        }

        const { data: { user }, error: userError } =
    await supabaseClient.auth.getUser();

if (userError || !user) {
    alert("Please log in before creating your talent profile.");
    window.location.href = "login.html";
    return;
}

        try {
            const { error } = await supabaseClient
                .from("talents")
                .insert([{
                   user_id: user.id,
                   full_name: fullName,
                   email: email,
                   skills: skill
                }]); 

            if (error) {
                console.error("Supabase error:", error);
                alert("Registration failed: " + error.message);
                return;
            }

            alert("Talent profile created successfully!");
            form.reset();

            // FIX 4: refresh the list after a successful insert
            await loadTalents();

        } catch (err) {
            console.error("Error:", err);
            alert("Something went wrong. Please try again.");
        }
    }

    // FIX 2: load talents from Supabase instead of localStorage
    async function loadTalents() {
        const { data, error } = await supabaseClient
            .from("talents")
            .select("*");

        if (error) {
            console.error("Load error:", error);
            document.getElementById("talentList").innerHTML =
                "<p>Could not load talents.</p>";
            return;
        }

        allTalents = data || [];
        displayTalents();
    }

    function displayTalents() {
        const talentList = document.getElementById("talentList");
        const searchTerm = document
            .getElementById("talentSearch")
            .value.toLowerCase()
            .trim();

        document.getElementById("talentCount").textContent =
            "Registered Talents: " + allTalents.length;

        // FIX 3: use the real column names (full_name, skills)
        const filtered = allTalents.filter(function (talent) {
            return (talent.full_name || "").toLowerCase().includes(searchTerm) ||
                   (talent.skills || "").toLowerCase().includes(searchTerm);
        });

        talentList.innerHTML = "";

        filtered.forEach(function (talent) {
            const card = document.createElement("div");
            card.className = "talent-card";
            card.innerHTML = `
                <h3>${escapeHtml(talent.full_name)}</h3>
                <p>${escapeHtml(talent.email)}</p>
                <p>Skill: ${escapeHtml(talent.skills)}</p>
            `;
            talentList.appendChild(card);
        });

        if (filtered.length === 0) {
            talentList.innerHTML = "<p>No talents found.</p>";
        }
    }

    document.getElementById("talentSearch").addEventListener("input", displayTalents);

    loadTalents();
    async function logoutUser() {
    const { error } = await supabaseClient.auth.signOut();

    if (error) {
        alert("Logout failed: " + error.message);
        return;
    }

    alert("You have logged out successfully.");
    window.location.href = "login.html";
}
</script>
</body>
</html>
